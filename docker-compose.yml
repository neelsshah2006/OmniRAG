services:

  redis:
    image: redis:7-alpine
    container_name: omnirag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: omnirag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  minio:
    image: "minio/minio:latest"
    container_name: omnirag-minio

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    volumes:
      - minio_data:/data

    restart: unless-stopped


volumes:

  redis_data:

  qdrant_data:

  minio_data: