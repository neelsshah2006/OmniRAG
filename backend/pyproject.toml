[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.137.2",
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "redis>=8.0.0",
    "sentence-transformers>=5.6.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
]

[tool.ruff]

line-length = 88

target-version = "py312"


[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "B",
]

ignore = []


[tool.ruff.format]

quote-style = "double"

indent-style = "space"
